name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff mypy

      - name: Lint (ruff)
        run: ruff check backend/app --exit-zero

      - name: Type check (mypy)
        run: mypy backend/app --ignore-missing-imports --no-strict-optional || true

      - name: Run unit + integration tests
        run: |
          pytest tests/unit tests/integration -v
        env:
          MONGO_URI: mongodb://localhost:27017
          MONGO_DB_NAME: videomind_test
          PINECONE_API_KEY: dummy-not-used-in-ci
          GROQ_API_KEY: dummy-not-used-in-ci

  build-docker-images:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t videomind-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t videomind-frontend:ci ./frontend

    # Note: no model inference (Whisper/CLIP/Groq) runs in CI — only
    # dependency installation, static checks, unit/integration tests with
    # mocked externals, and Docker image builds, per project rules.
